<!doctype html>
<html><head><meta charset="utf-8"><title>Mise Launch Film</title>
<style>
  @font-face { font-family: Outfit; font-weight: 500; src: url(../../.claude/skills/paper-pixel-motion/engine/fonts/Outfit-500.woff2); }
  @font-face { font-family: Outfit; font-weight: 600; src: url(../../.claude/skills/paper-pixel-motion/engine/fonts/Outfit-600.woff2); }
  @font-face { font-family: Outfit; font-weight: 700; src: url(../../.claude/skills/paper-pixel-motion/engine/fonts/Outfit-700.woff2); }
  @font-face { font-family: Geist; font-weight: 500; src: url(../../.claude/skills/paper-pixel-motion/engine/fonts/Geist-500.woff2); }
  @font-face { font-family: Geist; font-weight: 600; src: url(../../.claude/skills/paper-pixel-motion/engine/fonts/Geist-600.woff2); }
  @font-face { font-family: Geist; font-weight: 700; src: url(../../.claude/skills/paper-pixel-motion/engine/fonts/Geist-700.woff2); }
  html, body { margin: 0; background: #0b0b0b; color: #ddd; font: 13px system-ui; }
  canvas { display: block; max-width: 100vw; max-height: 92vh; margin: auto; }
  #warn { padding: 6px 12px; white-space: pre-wrap; }
</style></head>
<body><canvas></canvas><div id="warn"></div>
<script src="../../.claude/skills/paper-pixel-motion/engine/ppm.js"></script>
<script src="../../.claude/skills/paper-pixel-motion/engine/sprites.js"></script>
<script src="../../.claude/skills/paper-pixel-motion/engine/flow.js"></script>
<script src="../../.claude/skills/paper-pixel-motion/engine/grid-sprites.js"></script>
<script src="../../.claude/skills/paper-pixel-motion/engine/plan.js"></script>
<script src="../../.claude/skills/paper-pixel-motion/engine/compose.js"></script>
<script src="mise-sprites.js"></script>
<!-- the film is data: swap this file (or ?spec=other.film.js) -->
<script>document.write(`<script src="${new URLSearchParams(location.search).get('spec') || 'mise.film.js'}"><\/script>`); document.write(`<script src="${new URLSearchParams(location.search).get('words') || 'data:text/javascript,'}"><\/script>`);</script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get('mode')) SPEC.mode = q.get('mode');
  await Promise.all(['500 40px Outfit', '600 40px Outfit', '700 40px Outfit', '500 40px Geist', '600 40px Geist'].map(f => document.fonts.load(f)));
  const film = await PPMCompose.build(document.querySelector('canvas'), SPEC, window.WORDS);
  document.getElementById('warn').textContent = film.plan.warnings.length ? '⚠ ' + film.plan.warnings.join('\n⚠ ') : '';
  window.film = film; window.ready = true;
  if (!q.has('render')) film.play();
})().catch(e => { document.getElementById('warn').textContent = e.message; console.error(e.message); });
</script>
</body></html>
